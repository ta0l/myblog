# nginx/default.conf
server {
    listen 80;
    server_name localhost; # 公网部署域名

    # 代理 Go 后端 API
    location /api/ {
        proxy_pass http://api:8888/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 10M; # 允许上传图片
    }

    # 代理 Astro 前端 (包含页面和静态资源)
    location / {
        proxy_pass http://web:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}