# .github/workflows/deploy.yml
name: Deploy to VPS

# 触发条件：当你 push 代码到 main 分支时触发 (如果你的主分支叫 master，请修改此处)
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 赋予此脚本向 GHCR 推送镜像的权限
    permissions:
      contents: read
      packages: write

    steps:
      - name: 1. 拉取最新代码
        uses: actions/checkout@v4

      - name: 2. 转换仓库名为全小写 (Docker 镜像名规范)
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: 3. 登录到 GitHub 镜像仓库 (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. 编译并推送 Go 后端镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}/api:latest

      - name: 5. 编译并推送 Astro 前端镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}/web:latest

      - name: 6. 将生产环境 Compose 文件传送到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml"
          target: "/opt/myblog/"  # 确保你服务器上有这个目录！

      - name: 7. 登录服务器并重启服务
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/myblog/
            # 在服务器上登录 GHCR，使用自动生成的 Token，无需手动干预
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # 拉取最新镜像
            docker-compose -f docker-compose.prod.yml pull
            # 重启容器并清理悬空(旧的)镜像释放空间
            docker-compose -f docker-compose.prod.yml up -d
            docker image prune -f